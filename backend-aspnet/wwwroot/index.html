<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Control System – ระบบควบคุมสนามโค้ด</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/variables.css" rel="stylesheet">
  <link href="css/base.css" rel="stylesheet">
  <link href="css/layout.css" rel="stylesheet">
  <link href="css/sidebar.css" rel="stylesheet">
  <link href="css/header.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="css/forms.css" rel="stylesheet">
  <link href="css/auth.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div id="loading" class="loading-screen">
      <div class="loading-spinner"></div>
      <p class="loading-text">กำลังโหลด...</p>
    </div>
    <div id="auth-pages" class="d-none"></div>
    <div id="app-layout" class="d-none dashboard-layout">
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <i class="bi bi-cpu-fill brand-icon"></i>
          <span class="brand-text">Field Control</span>
        </div>
        <div class="user-profile">
          <div class="user-avatar">
            <i class="bi bi-person-fill"></i>
          </div>
          <div class="profile-info">
            <span class="profile-name" id="sidebar-username">User</span>
            <span class="profile-email" id="sidebar-email">user@example.com</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <ul class="nav-list">
            <li class="nav-item" data-page="dashboard">
              <i class="bi bi-grid-1x2-fill nav-icon"></i>
              <span>แดชบอร์ด</span>
            </li>
            <li class="nav-item" data-page="queue">
              <i class="bi bi-calendar-week nav-icon"></i>
              <span>จองคิว</span>
            </li>
            <li class="nav-item" data-page="control">
              <i class="bi bi-joystick nav-icon"></i>
              <span>ควบคุมสนาม</span>
            </li>
            <li class="nav-item d-none" id="nav-admin" data-page="admin">
              <i class="bi bi-shield-lock nav-icon"></i>
              <span>จัดการระบบ</span>
            </li>
          </ul>
          <div class="nav-footer">
            <div class="nav-item" id="btn-logout">
              <i class="bi bi-box-arrow-right nav-icon"></i>
              <span>ออกจากระบบ</span>
            </div>
          </div>
        </nav>
      </aside>
      <main class="dashboard-main">
        <header class="header">
          <button class="btn sidebar-toggle" id="sidebar-toggle" aria-label="เปิดเมนู">
            <i class="bi bi-list"></i>
          </button>
          <div class="header-spacer"></div>
          <div class="header-right">
            <div class="header-badge">
              <span class="status-dot"></span>
              <span>Real-time</span>
            </div>
          </div>
        </header>
        <div class="main-content">
          <div id="page-content"></div>
        </div>
      </main>
    </div>
  </div>
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/robot-hub.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/pages/robot-selector.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/queue.js"></script>
  <script src="js/pages/control.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
