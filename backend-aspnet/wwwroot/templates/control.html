<h1 class="welcome-title">ควบคุมสนาม</h1>
<p class="page-subtitle">อัปโหลดและรันโค้ด Python บนสนาม</p>
<div id="robot-selector-control"></div>
<div id="status-area"></div>
<div class="row mt-4">
  <div class="col-md-6">
    <div class="card-custom">
      <h5 class="mb-3">อัปโหลดโค้ด Python</h5>
      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept=".py" class="d-none">
        <p class="mb-0"><i class="bi bi-cloud-upload d-block mb-2" style="font-size:2rem; opacity:0.6"></i>ลากไฟล์ .py มาวาง หรือคลิกเพื่อเลือก</p>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card-custom">
      <h5 class="mb-3">ควบคุมสนาม</h5>
      <button class="btn btn-success w-100 mb-2" id="btn-run"><i class="bi bi-play-fill me-1"></i> รันโค้ด</button>
      <button class="btn btn-danger w-100 mb-2" id="btn-stop"><i class="bi bi-stop-fill me-1"></i> หยุด</button>
      <button class="btn btn-warning w-100 mb-2" id="btn-reset"><i class="bi bi-arrow-counterclockwise me-1"></i> รีเซ็ต</button>
      <div id="checkin-wrap"></div>
    </div>
    <div class="card-custom mt-3">
      <h5 class="mb-3">กล้อง</h5>
      <button class="btn btn-success btn-sm me-2" id="btn-cam-start">เปิดกล้อง</button>
      <button class="btn btn-danger btn-sm" id="btn-cam-stop">ปิดกล้อง</button>
      <div id="camera-feed" class="mt-3"></div>
    </div>
  </div>
</div>
<div class="card-custom mt-4">
  <h5 class="mb-3">ไฟล์ที่อัปโหลด</h5>
  <div id="uploads-list"></div>
</div>
