<div class="modal fade show d-block" style="background: rgba(0,0,0,0.5)">

    <div class="modal-content bg-dark">
      <div class="modal-header border-secondary">
        <h5>จองคิว</h5>
        <button type="button" class="btn-close btn-close-white" data-dismiss></button>
      </div>
      <div class="modal-body">
        <form id="book-form">
          <div class="mb-3">
            <label class="form-label">เวลาเริ่ม</label>
            <input type="datetime-local" class="form-control" name="startTime" required>
          </div>
          <div class="mb-3">
            <label class="form-label">เวลาสิ้นสุด</label>
            <input type="datetime-local" class="form-control" name="endTime" required>
          </div>
          <button type="submit" class="btn btn-primary">จอง</button>
        </form>
      </div>
    </div>
  </div>
</div>
