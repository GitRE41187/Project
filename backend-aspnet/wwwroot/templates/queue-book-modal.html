<div class="modal fade show d-block" style="background: rgba(0,0,0,0.5)">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark">
      <div class="modal-header border-secondary">
        <h5>จองคิว</h5>
        <button type="button" class="btn-close btn-close-white" data-dismiss></button>
      </div>
      <div class="modal-body">
        <form id="book-form">
          <div class="mb-3">
            <label class="form-label">วันที่</label>
            <input type="date" class="form-control" name="bookingDate" required>
          </div>
          <div class="mb-3">
            <label class="form-label">ช่วงเวลา (รายชั่วโมง)</label>
            <select class="form-select" name="hourSlot" required>
              <option value="" selected disabled>เลือกช่วงเวลา</option>
            </select>
          </div>
          <p class="text-muted mb-3" id="slot-preview">ระยะเวลาใช้งาน: 1 ชั่วโมงต่อการจอง</p>
          <button type="submit" class="btn btn-primary">จอง</button>
        </form>
      </div>
    </div>
  </div>
</div>
