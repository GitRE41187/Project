<div class="modal fade show d-block modal-backdrop-theme">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-content-theme">
      <div class="modal-header">
        <h5 class="modal-title d-flex align-items-center gap-2">
          <i class="bi bi-calendar-plus text-primary"></i> จองคิว
        </h5>
        <button type="button" class="btn-close" data-dismiss aria-label="ปิด"></button>
      </div>
      <div class="modal-body">
        <form id="book-form">
          <div class="mb-3">
            <label class="form-label fw-semibold">เวลาเริ่ม</label>
            <input type="datetime-local" class="form-control" name="startTime" step="300" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold d-flex justify-content-between align-items-center mb-2">
              <span>เวลาสิ้นสุด</span>
              <span class="text-muted fw-normal small">เลือกด่วน:</span>
            </label>
            <div class="d-flex gap-2 mb-2 flex-wrap">
              <button type="button" class="btn btn-sm btn-outline-secondary duration-chip" data-mins="15">15 นาที</button>
              <button type="button" class="btn btn-sm btn-outline-secondary duration-chip" data-mins="30">30 นาที</button>
              <button type="button" class="btn btn-sm btn-outline-secondary duration-chip" data-mins="45">45 นาที</button>
              <button type="button" class="btn btn-sm btn-outline-secondary duration-chip" data-mins="60">1 ชั่วโมง</button>
            </div>
            <input type="datetime-local" class="form-control" name="endTime" step="300" required>
          </div>
          <div class="booking-preview-box" id="slot-preview">เลือกระยะเวลาได้อิสระ แต่รวมกันต้องไม่เกิน 1 ชั่วโมง</div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-calendar-check me-1"></i> ยืนยันจองคิว
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
