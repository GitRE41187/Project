<div class="modal fade show d-block modal-backdrop-theme">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-content-theme">
      <div class="modal-header">
        <h5 class="modal-title">จองคิว</h5>
        <button type="button" class="btn-close" data-dismiss aria-label="ปิด"></button>
      </div>
      <div class="modal-body">
        <form id="book-form">
          <div class="mb-3">
            <label class="form-label">เวลาเริ่ม</label>
            <input type="datetime-local" class="form-control" name="startTime" step="300" required>
          </div>
          <div class="mb-3">
            <label class="form-label">เวลาสิ้นสุด</label>
            <input type="datetime-local" class="form-control" name="endTime" step="300" required>
          </div>
          <p class="text-muted mb-3" id="slot-preview">เลือกระยะเวลาได้อิสระ แต่รวมกันต้องไม่เกิน 1 ชั่วโมง</p>
          <button type="submit" class="btn btn-primary">จอง</button>
        </form>
      </div>
    </div>
  </div>
</div>
