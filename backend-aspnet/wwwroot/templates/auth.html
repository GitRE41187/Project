<button type="button" class="btn-theme-toggle auth-floating-theme" data-theme-toggle aria-label="สลับธีม" title="สลับโหมดสว่าง/มืด"></button>
<div class="auth-card p-4">
  <h3 class="text-center mb-2" id="auth-title">ยินดีต้อนรับกลับ!</h3>
  <p class="text-center text-muted mb-4" id="auth-subtitle">เข้าสู่ระบบด้วยบัญชีของคุณ</p>
  <form id="auth-form">
    <div class="mb-3" id="field-username">
      <label class="form-label">ชื่อผู้ใช้</label>
      <input type="text" class="form-control" name="username" required placeholder="ชื่อผู้ใช้">
    </div>
    <div class="mb-3 d-none" id="field-email">
      <label class="form-label">อีเมล</label>
      <input type="email" class="form-control" name="email" placeholder="อีเมล">
    </div>
    <div class="mb-3">
      <label class="form-label">รหัสผ่าน</label>
      <input type="password" class="form-control" name="password" required placeholder="รหัสผ่าน">
    </div>
    <div class="mb-3 d-none" id="field-confirm">
      <label class="form-label">ยืนยันรหัสผ่าน</label>
      <input type="password" class="form-control" name="confirmPassword" placeholder="ยืนยันรหัสผ่าน">
    </div>
    <button type="submit" class="btn btn-primary w-100 mb-2" id="auth-submit">เข้าสู่ระบบ</button>
    <p class="text-center text-muted mb-0">
      <span id="auth-switch-text">ยังไม่มีบัญชี? </span>
      <a href="#" id="switch-auth">สมัครฟรี</a>
    </p>
  </form>
</div>
